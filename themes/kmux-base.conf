# kmux base theme

# Keep the status line at the bottom and readable in plain fonts.
set -g status-position bottom
set -g status-style "fg=#bac2de,bg=#1e1e2e"
set -g status-left-length 32
set -g status-right-length 48
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[default]"
set -g status-right "#[fg=#bac2de,bg=#1e1e2e] %H:%M #[default]"

set -g window-status-style "fg=#bac2de,bg=#1e1e2e"
set -g window-status-current-style "fg=#1e1e2e,bg=#89b4fa,bold"
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "fg=#1e1e2e,bg=#f9e2af,bold"
set -g mode-style "fg=#1e1e2e,bg=#f9e2af,bold"

set -g bell-action none
set -g remain-on-exit on
set -g sidebar on
set -g mouse on
